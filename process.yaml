# ============ 任务列表 ============
project_base:
  project_name: 'try'
  project_path: 'E:\pycharm_project\pytorch_001\Pytorch_qi_Framwork_v1.0\Projects\try'

process:
  - name: data_partition
    script: 'E:\pycharm_project\pytorch_001\Pytorch_qi_Framwork_v1.0\tools\data_partitioning.py'
    args:
      config: 'config.yaml'
    output: null

  - name: mean_std
    script: 'E:\pycharm_project\pytorch_001\Pytorch_qi_Framwork_v1.0\tools\mean_std.py'
    args:
      config: "{{data_partition.args.config}}"
      process: 'process.yaml'
    output: Intermediate_data/mean_std.json

  - name: train
    script: train.py
    args:
      config: "{{data_partition.args.config}}"
      process: "{{mean_std.args.process}}"
      mean_std_stats: "{{mean_std.output}}"
    output: Intermediate_data/best_wst_path.json

  - name: test
    script: test.py
    args:
      config: "{{data_partition.args.config}}"
      process: "{{mean_std.args.process}}"
      mean_std_stats: "{{mean_std.output}}"
      best_wst_path: "{{train.output}}"
    output: Intermediate_data/test_acc.json

  - name: Inference
    script: 'E:\pycharm_project\pytorch_001\Pytorch_qi_Framwork_v1.0\tools\Inference_work.py'
    args:
      config: "{{data_partition.args.config}}"
      process: "{{mean_std.args.process}}"
      test_data_dir: 'data/test'
      train_data_dir: 'data/train'
      mean_std_stats: "{{mean_std.output}}"
      best_wst_path: "{{train.output}}"
    output: null

